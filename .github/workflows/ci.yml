name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/**
      - release/**
  pull_request:
    branches:
      - main

jobs:
  project-readiness:
    name: Project Readiness
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: food-life-agent-web/package-lock.json

      - name: Install frontend dependencies
        working-directory: food-life-agent-web
        run: npm ci

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai/food-agent-api/requirements.txt

      - name: Install Agent dependencies
        run: python -m pip install -r ai/food-agent-api/requirements.txt

      - name: Verify project readiness
        shell: pwsh
        run: ./scripts/verify-company-readiness.ps1 -SkipRuntimeSmoke

      - name: Prepare browser for frontend checks
        working-directory: food-life-agent-web
        run: npx --yes --package @playwright/cli@0.1.22 playwright-cli install-browser

      - name: Verify frontend browser flows and responsive layouts
        working-directory: food-life-agent-web
        run: npm run test:ui
