name: CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  project-readiness:
    name: Project Readiness
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: food-life-agent-web/package-lock.json

      - name: Install frontend dependencies
        working-directory: food-life-agent-web
        run: npm ci

      - name: Verify project readiness
        shell: pwsh
        run: ./scripts/verify-company-readiness.ps1 -SkipRuntimeSmoke
