name: CI

on:
  push:
    branches:
      - main
      - feature/**
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Verify microservice boundaries
        shell: pwsh
        run: ./scripts/verify-microservice-boundaries.ps1

      - name: Maven test
        run: mvn -B test

  frontend:
    name: Frontend
    runs-on: windows-latest

    defaults:
      run:
        working-directory: food-life-agent-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: food-life-agent-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
