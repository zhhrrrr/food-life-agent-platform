server:
  port: 8201

management:
  server:
    port: 8202

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

spring:
  application:
    name: food-business-service
  cloud:
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD_ADDR:localhost:8858}
        port: ${SENTINEL_BUSINESS_TRANSPORT_PORT:8731}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/food_business_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration

food:
  mq:
    review-created-queue: food.business.review.created.queue
    package-stock-event-queue: food.business.package.stock.event.queue
    dead-letter-exchange: food.business.dlx
    review-created-dead-letter-queue: food.business.review.created.dlq
    package-stock-event-dead-letter-queue: food.business.package.stock.event.dlq
    backlog-alert-threshold: ${BUSINESS_MQ_BACKLOG_ALERT_THRESHOLD:1000}
    retry-delay-seconds: 30
    retry-limit: 50
    processing-timeout-seconds: 120
  jobs:
    business-event-retry:
      enabled: true
      fixed-delay-ms: 30000
      limit: 50
  auth:
    internal-call:
      enabled: true
      paths:
        - /api/internal/**
      header-name: x-internal-call
      header-value: food-life-agent
      secret-header-name: x-internal-secret
      secret: ${FOOD_INTERNAL_SECRET:local-internal-secret}
    include-paths:
      - /**
    exclude-paths:
      - /health
      - /error
      - /api/shop-category/**
      - /api/shop/**
      - /api/package/*
      - /api/package/of/shop
      - /api/package/trade-snapshot/*
      - /api/internal/**
      - /v3/api-docs
      - /v3/api-docs/**
      - /swagger-ui.html
      - /swagger-ui/**
    role-access:
      enabled: true
      default-role: USER
      local-user-roles:
        1: ADMIN
      paths:
        - pattern: /api/business/operations/**
          roles:
            - ADMIN
            - OPERATOR
