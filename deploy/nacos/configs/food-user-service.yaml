server:
  port: 8101

spring:
  application:
    name: food-user-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/food_user_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root

food:
  user:
    repository:
      type: mysql
  auth:
    include-paths:
      - /**
    exclude-paths:
      - /health
      - /api/user/code
      - /api/user/login
      - /api/user/logout
