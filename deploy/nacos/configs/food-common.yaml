spring:
  redis:
    host: localhost
    port: 6379
    database: 0

feign:
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 5000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

food:
  auth:
    enabled: true
    token-header: authorization
    token-prefix: "food:login:token:"
    token-ttl-minutes: 30
