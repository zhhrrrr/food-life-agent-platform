server:
  port: 8301

management:
  server:
    port: 8302

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

spring:
  application:
    name: food-trade-service
  cloud:
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD_ADDR:localhost:8858}
        port: ${SENTINEL_TRADE_TRANSPORT_PORT:8732}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/food_trade_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    validate-on-migrate: true
    locations: classpath:db/migration

food:
  mq:
    trade-order-event-queue: food.trade.order.event.queue
    payment-event-queue: food.trade.payment.event.queue
    order-timeout-close-queue: food.trade.order.timeout.close.queue
    order-timeout-delay-queue: food.trade.order.timeout.delay.queue
    order-timeout-delay-routing-key: order.cancel.timeout.delay
    order-timeout-delay-millis: ${ORDER_TIMEOUT_DELAY_MILLIS:1800000}
    retry-delay-seconds: 30
    retry-limit: 50
    processing-timeout-seconds: 120
  jobs:
    trade-event-retry:
      enabled: true
      fixed-delay-ms: 30000
      limit: 50
  trade:
    normal:
      order-timeout-cancel:
        enabled: true
        fixed-delay-ms: 60000
        timeout-minutes: 30
      package-stock-sync:
        enabled: true
        fixed-delay-ms: 60000
    group-buy:
      timeout-compensation:
        enabled: true
        fixed-delay-ms: 60000
    coupon:
      expire-scan:
        enabled: true
        fixed-delay-ms: 60000
        limit: 500
    payment:
      order-timeout-close:
        enabled: true
        fixed-delay-ms: 60000
        timeout-minutes: 30
    seckill:
      order-request-process:
        enabled: true
        fixed-delay-ms: 30000
      order-request-recovery:
        enabled: true
        fixed-delay-ms: 60000
  auth:
    internal-call:
      enabled: true
      paths:
        - /api/internal/**
      header-name: x-internal-call
      header-value: food-life-agent
      secret-header-name: x-internal-secret
      secret: ${FOOD_INTERNAL_SECRET:local-internal-secret}
    include-paths:
      - /**
    exclude-paths:
      - /health
      - /error
      - /api/trade/pay/callback/**
      - /api/internal/**
      - /v3/api-docs
      - /v3/api-docs/**
      - /swagger-ui.html
      - /swagger-ui/**
    role-access:
      enabled: true
      default-role: USER
      local-user-roles:
        1: ADMIN
      paths:
        - pattern: /api/trade/operations/**
          roles:
            - ADMIN
            - OPERATOR
        - pattern: /api/trade/orders/*/refund/confirm
          roles:
            - ADMIN
            - OPERATOR
