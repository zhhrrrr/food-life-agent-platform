server:
  port: 8080

spring:
  cloud:
    sentinel:
      transport:
        port: ${SENTINEL_GATEWAY_TRANSPORT_PORT:8719}
    gateway:
      default-filters:
        - PreserveHostHeader
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            exposedHeaders:
              - authorization
              - X-Trace-Id
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: food-user-route
          uri: lb://food-user-service
          predicates:
            - Path=/api/user/**
        - id: food-business-route
          uri: lb://food-business-service
          predicates:
            - Path=/api/shop-category/**,/api/shop/**,/api/package/**,/api/shop-homepage/**,/api/reviews/**,/api/favorites/shops/**
        - id: food-trade-route
          uri: lb://food-trade-service
          predicates:
            - Path=/api/trade/**

logging:
  level:
    org.springframework.cloud.gateway: info

food:
  gateway:
    auth:
      enabled: true
      token-header: authorization
      token-prefix: "food:login:token:"
      exclude-paths:
        - /health
        - /api/user/code
        - /api/user/login
        - /api/user/logout
        - /api/shop-category/**
        - /api/shop/**
        - /api/package/**
        - /api/trade/pay/callback/**
    security:
      blacklist:
        enabled: true
        paths:
          - /internal/**
          - /actuator/**
      rate-limit:
        enabled: false
        ip:
          enabled: true
          capacity: 120
          window-seconds: 60
        user:
          enabled: true
          capacity: 60
          window-seconds: 60
    sentinel:
      enabled: true
      trade-route-qps: 300
      business-route-qps: 500
      user-route-qps: 200
      trade-order-create-qps: 80
      seckill-order-create-qps: 30
      payment-callback-qps: 100
      user-header-name: authorization
      user-header-qps: 20
      smoke-rule-enabled: true
