server:
  port: 8080

management:
  server:
    port: 8081

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: user-service
        url: /v3/api-docs/user
      - name: business-service
        url: /v3/api-docs/business
      - name: trade-service
        url: /v3/api-docs/trade

spring:
  cloud:
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD_ADDR:localhost:8858}
        port: ${SENTINEL_GATEWAY_TRANSPORT_PORT:8730}
    gateway:
      default-filters:
        - PreserveHostHeader
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            exposedHeaders:
              - authorization
              - X-Trace-Id
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: food-user-route
          uri: lb://food-user-service
          predicates:
            - Path=/api/user/**
        - id: food-user-openapi-route
          uri: lb://food-user-service
          predicates:
            - Path=/v3/api-docs/user
          filters:
            - RewritePath=/v3/api-docs/user,/v3/api-docs
        - id: food-business-route
          uri: lb://food-business-service
          predicates:
            - Path=/api/shop-category/**,/api/shop/**,/api/package/**,/api/shop-homepage/**,/api/reviews/**,/api/favorites/shops/**,/api/business/operations/**
        - id: food-business-openapi-route
          uri: lb://food-business-service
          predicates:
            - Path=/v3/api-docs/business
          filters:
            - RewritePath=/v3/api-docs/business,/v3/api-docs
        - id: food-trade-route
          uri: lb://food-trade-service
          predicates:
            - Path=/api/trade/**
        - id: food-trade-openapi-route
          uri: lb://food-trade-service
          predicates:
            - Path=/v3/api-docs/trade
          filters:
            - RewritePath=/v3/api-docs/trade,/v3/api-docs

logging:
  level:
    org.springframework.cloud.gateway: info

food:
  gateway:
    auth:
      enabled: true
      token-header: authorization
      token-prefix: "food:login:token:"
      user-id-header: x-user-id
      user-nickname-header: x-user-nickname
      user-icon-header: x-user-icon
      internal-header-name: x-internal-call
      internal-secret-header-name: x-internal-secret
      exclude-paths:
        - /health
        - /error
        - /api/user/code
        - /api/user/login
        - /api/user/logout
        - /api/shop-category/**
        - /api/shop/**
        - /api/package/*
        - /api/package/of/shop
        - /api/package/trade-snapshot/*
        - /api/trade/pay/callback/**
        - /v3/api-docs/**
        - /swagger-ui.html
        - /swagger-ui/**
    security:
      blacklist:
        enabled: true
        paths:
          - /internal/**
          - /api/internal/**
          - /actuator/**
          - /api/package/*/stock/occupy
          - /api/package/*/stock/release
          - /api/package/*/sold/confirm
          - /api/package/*/sold/rollback
    sentinel:
      enabled: true
      trade-route-qps: 300
      business-route-qps: 500
      user-route-qps: 200
      trade-order-create-qps: 80
      seckill-order-create-qps: 30
      payment-callback-qps: 100
      user-header-name: authorization
      user-header-qps: 20
      smoke-rule-enabled: true
