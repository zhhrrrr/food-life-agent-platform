# Copy to .runtime/alipay-sandbox.properties. Do not put private key contents here.
food.payment.alipay.app-id=YOUR_SANDBOX_APP_ID
food.payment.alipay.gateway-url=https://openapi-sandbox.dl.alipaydev.com/gateway.do
food.payment.alipay.seller-id=YOUR_SANDBOX_SELLER_UID
food.payment.alipay.private-key-path=C:/alipay-sandbox/app-private-key.txt
food.payment.alipay.public-key-path=C:/alipay-sandbox/alipay-public-key.txt
food.payment.alipay.notify-url=https://YOUR_NGROK_DOMAIN/api/trade/pay/callback/alipay
food.payment.alipay.return-url=http://localhost:5173/orders
