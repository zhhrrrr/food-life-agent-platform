server:
  port: 8201

spring:
  application:
    name: food-business-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/food_business_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
  redis:
    host: localhost
    port: 6379
    database: 0
  cloud:
    discovery:
      client:
        simple:
          instances:
            food-trade-service:
              - uri: http://localhost:8301

feign:
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 5000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

food:
  auth:
    enabled: true
    token-header: authorization
    token-prefix: "food:login:token:"
    token-ttl-minutes: 30
    include-paths:
      - /**
    exclude-paths:
      - /health
      - /api/shop-category/**
      - /api/shop/**
      - /api/package/**
