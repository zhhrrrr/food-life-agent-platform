server:
  port: 8201

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/food_business_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
  redis:
    host: localhost
    port: 6379
    database: 0
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
  cloud:
    alibaba:
      seata:
        tx-service-group: ${SEATA_TX_GROUP:food-life-agent-tx-group}
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD_ADDR:localhost:8858}
        port: ${SENTINEL_TRANSPORT_PORT:8720}
    discovery:
      client:
        simple:
          instances:
            food-trade-service:
              - uri: http://localhost:8301

feign:
  sentinel:
    enabled: true
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 5000

seata:
  enabled: ${SEATA_ENABLED:false}
  application-id: ${spring.application.name}
  tx-service-group: ${SEATA_TX_GROUP:food-life-agent-tx-group}
  enable-auto-data-source-proxy: true
  service:
    vgroup-mapping:
      food-life-agent-tx-group: ${SEATA_CLUSTER:default}
    grouplist:
      default: ${SEATA_SERVER_ADDR:127.0.0.1:8091}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

food:
  mq:
    enabled: ${FOOD_MQ_ENABLED:false}
    review-created-queue: food.business.review.created.queue
    package-stock-event-queue: food.business.package.stock.event.queue
  auth:
    enabled: true
    token-header: authorization
    token-prefix: "food:login:token:"
    token-ttl-minutes: 30
    internal-call:
      enabled: true
      paths:
        - /api/internal/**
      header-name: x-internal-call
      header-value: food-life-agent
      secret-header-name: x-internal-secret
      secret: ${FOOD_INTERNAL_SECRET:local-internal-secret}
    include-paths:
      - /**
    exclude-paths:
      - /health
      - /error
      - /api/shop-category/**
      - /api/shop/**
      - /api/package/*
      - /api/package/of/shop
      - /api/package/trade-snapshot/*
      - /api/internal/**
