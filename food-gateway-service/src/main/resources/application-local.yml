server:
  port: 8080

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        food_http_server_request_duration: true
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}

spring:
  redis:
    host: localhost
    port: 6379
    database: 0
  cloud:
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD_ADDR:localhost:8858}
        port: ${SENTINEL_TRANSPORT_PORT:8730}
    discovery:
      client:
        simple:
          instances:
            food-user-service:
              - uri: http://localhost:8101
            food-business-service:
              - uri: http://localhost:8201
            food-trade-service:
              - uri: http://localhost:8301
    gateway:
      default-filters:
        - PreserveHostHeader
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            exposedHeaders:
              - authorization
              - X-Trace-Id
            allowCredentials: true
            maxAge: 3600
      routes:
        - id: food-user-route
          uri: lb://food-user-service
          predicates:
            - Path=/api/user/**
        - id: food-business-route
          uri: lb://food-business-service
          predicates:
            - Path=/api/shop-category/**,/api/shop/**,/api/package/**,/api/shop-homepage/**,/api/reviews/**,/api/favorites/shops/**
        - id: food-trade-route
          uri: lb://food-trade-service
          predicates:
            - Path=/api/trade/**

logging:
  level:
    org.springframework.cloud.gateway: info

food:
  observability:
    enabled: true
    trace-header: X-Trace-Id
    request-log-enabled: true
    log-normal-request: ${FOOD_OBSERVABILITY_LOG_NORMAL_REQUEST:true}
    slow-api-threshold-ms: ${FOOD_SLOW_API_THRESHOLD_MS:1000}
    slow-feign-threshold-ms: ${FOOD_SLOW_FEIGN_THRESHOLD_MS:1000}
  gateway:
    auth:
      enabled: true
      token-header: authorization
      token-prefix: "food:login:token:"
      user-id-header: x-user-id
      user-nickname-header: x-user-nickname
      user-icon-header: x-user-icon
      internal-header-name: x-internal-call
      internal-secret-header-name: x-internal-secret
      exclude-paths:
        - /health
        - /error
        - /api/user/code
        - /api/user/login
        - /api/user/logout
        - /api/shop-category/**
        - /api/shop/**
        - /api/package/*
        - /api/package/of/shop
        - /api/package/trade-snapshot/*
        - /api/trade/pay/callback/**
    security:
      blacklist:
        enabled: true
        paths:
          - /internal/**
          - /api/internal/**
          - /actuator/**
          - /api/package/*/stock/occupy
          - /api/package/*/stock/release
          - /api/package/*/sold/confirm
          - /api/package/*/sold/rollback
    sentinel:
      enabled: true
      trade-route-qps: 300
      business-route-qps: 500
      user-route-qps: 200
      trade-order-create-qps: 80
      seckill-order-create-qps: 30
      payment-callback-qps: 100
      user-header-name: authorization
      user-header-qps: 20
      smoke-rule-enabled: true
