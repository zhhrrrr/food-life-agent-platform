spring:
  application:
    name: food-trade-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:nacos}
  cloud:
    nacos:
      config:
        import-check:
          enabled: true

---
spring:
  config:
    activate:
      on-profile: nacos
    import:
      - nacos:food-common.yaml?group=${NACOS_CONFIG_GROUP:FOOD_LIFE_AGENT}&refreshEnabled=true
      - nacos:food-trade-service.yaml?group=${NACOS_CONFIG_GROUP:FOOD_LIFE_AGENT}&refreshEnabled=true
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:true}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_DISCOVERY_GROUP:FOOD_LIFE_AGENT}
      config:
        enabled: ${NACOS_CONFIG_ENABLED:true}
        namespace: ${NACOS_NAMESPACE:}
        group: ${NACOS_CONFIG_GROUP:FOOD_LIFE_AGENT}
        file-extension: yaml
