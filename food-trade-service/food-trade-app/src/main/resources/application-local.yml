server:
  port: 8301

management:
  server:
    port: 8302
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    rabbit:
      enabled: ${FOOD_RABBIT_HEALTH_ENABLED:true}
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
        food_http_server_request_duration: true
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/food_trade_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
  redis:
    host: localhost
    port: 6379
    database: 0
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
  cloud:
    alibaba:
      seata:
        tx-service-group: ${SEATA_TX_GROUP:food-life-agent-tx-group}
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD_ADDR:localhost:8858}
        port: ${SENTINEL_TRANSPORT_PORT:8721}
    discovery:
      client:
        simple:
          instances:
            food-business-service:
              - uri: http://localhost:8201
    openfeign:
      circuitbreaker:
        enabled: true
      micrometer:
        enabled: true
      client:
        config:
          default:
            connectTimeout: 3000
            readTimeout: 5000
            loggerLevel: basic

feign:
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 5000
        loggerLevel: basic

seata:
  enabled: ${SEATA_ENABLED:true}
  application-id: ${spring.application.name}
  tx-service-group: ${SEATA_TX_GROUP:food-life-agent-tx-group}
  enable-auto-data-source-proxy: true
  service:
    vgroup-mapping:
      food-life-agent-tx-group: ${SEATA_CLUSTER:default}
    grouplist:
      default: ${SEATA_SERVER_ADDR:127.0.0.1:8091}

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

food:
  observability:
    enabled: true
    trace-header: X-Trace-Id
    request-log-enabled: true
    log-normal-request: ${FOOD_OBSERVABILITY_LOG_NORMAL_REQUEST:true}
    slow-api-threshold-ms: ${FOOD_SLOW_API_THRESHOLD_MS:1000}
    slow-feign-threshold-ms: ${FOOD_SLOW_FEIGN_THRESHOLD_MS:1000}
  mq:
    enabled: ${FOOD_MQ_ENABLED:true}
    trade-order-event-queue: food.trade.order.event.queue
    payment-event-queue: food.trade.payment.event.queue
    order-timeout-close-queue: food.trade.order.timeout.close.queue
    order-timeout-delay-queue: food.trade.order.timeout.delay.queue
    order-timeout-delay-routing-key: order.cancel.timeout.delay
    order-timeout-delay-millis: ${ORDER_TIMEOUT_DELAY_MILLIS:1800000}
    retry-delay-seconds: 30
    retry-limit: 50
  jobs:
    trade-event-retry:
      enabled: true
      fixed-delay-ms: 30000
      limit: 50
  trade:
    normal:
      order-timeout-cancel:
        enabled: true
        fixed-delay-ms: 60000
        timeout-minutes: 30
      package-stock-sync:
        enabled: true
        fixed-delay-ms: 60000
    group-buy:
      timeout-compensation:
        enabled: true
        fixed-delay-ms: 60000
    coupon:
      expire-scan:
        enabled: true
        fixed-delay-ms: 60000
        limit: 500
    payment:
      order-timeout-close:
        enabled: true
        fixed-delay-ms: 60000
        timeout-minutes: 30
    seckill:
      order-request-process:
        enabled: true
        fixed-delay-ms: 30000
      order-request-recovery:
        enabled: true
        fixed-delay-ms: 60000
  auth:
    enabled: true
    token-header: authorization
    token-prefix: "food:login:token:"
    token-ttl-minutes: 30
    internal-call:
      enabled: true
      paths:
        - /api/internal/**
      header-name: x-internal-call
      header-value: food-life-agent
      secret-header-name: x-internal-secret
      secret: ${FOOD_INTERNAL_SECRET:local-internal-secret}
    include-paths:
      - /**
    exclude-paths:
      - /health
      - /error
      - /api/trade/pay/callback/**
      - /api/internal/**
