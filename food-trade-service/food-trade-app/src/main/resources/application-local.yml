server:
  port: 8301

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/food_trade_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
  redis:
    host: localhost
    port: 6379
    database: 0
  cloud:
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD_ADDR:localhost:8858}
        port: ${SENTINEL_TRANSPORT_PORT:8721}
    discovery:
      client:
        simple:
          instances:
            food-business-service:
              - uri: http://localhost:8201

feign:
  sentinel:
    enabled: true
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 5000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

food:
  mq:
    enabled: ${FOOD_MQ_ENABLED:false}
    name-server: ${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
    producer-group: food-trade-service-producer
    order-timeout-consumer-group: food-trade-order-timeout-consumer
    order-timeout-delay-level: 16
    retry-delay-seconds: 30
    retry-limit: 50
  jobs:
    trade-event-retry:
      enabled: true
      fixed-delay-ms: 30000
      limit: 50
  trade:
    normal:
      order-timeout-cancel:
        enabled: true
        fixed-delay-ms: 60000
        timeout-minutes: 30
      package-stock-sync:
        enabled: true
        fixed-delay-ms: 60000
    group-buy:
      timeout-compensation:
        enabled: true
        fixed-delay-ms: 60000
    coupon:
      expire-scan:
        enabled: true
        fixed-delay-ms: 60000
        limit: 500
    payment:
      order-timeout-close:
        enabled: true
        fixed-delay-ms: 60000
        timeout-minutes: 30
    seckill:
      order-request-process:
        enabled: true
        fixed-delay-ms: 30000
      order-request-recovery:
        enabled: true
        fixed-delay-ms: 60000
  auth:
    enabled: true
    token-header: authorization
    token-prefix: "food:login:token:"
    token-ttl-minutes: 30
    include-paths:
      - /**
    exclude-paths:
      - /health
      - /api/trade/pay/callback/**
